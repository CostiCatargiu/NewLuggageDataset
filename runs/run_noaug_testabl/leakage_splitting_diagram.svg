<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#176A3C"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#C0392B"/></marker>
    <symbol id="scnA" viewBox="0 0 92 46"><rect width="92" height="46" fill="#CDDDF0"/><rect y="34" width="92" height="12" fill="#B2C6E0"/><circle cx="34" cy="16" r="6" fill="#46566E"/><rect x="29" y="22" width="10" height="16" rx="3" fill="#46566E"/><rect x="40" y="27" width="9" height="7" rx="1.5" fill="#C0392B"/></symbol>
  </defs>
  <style>
    .ttl{font-size:23px;font-weight:bold;fill:#1F3864}
    .step{font-size:17px;font-weight:bold;fill:#1F3864}
    .cap{font-size:13.5px;font-weight:bold;fill:#244B85}
    .sm{font-size:12.5px;fill:#333}
    .tag{font-size:12.5px;font-weight:bold;fill:#141414}
    .good{fill:#176A3C}.bad{fill:#C0392B}
    .frm{fill:none;stroke:#2C5AA8;stroke-width:1.9}
    .edge{stroke:#176A3C;stroke-width:2.8}
    .flow{stroke:#333;stroke-width:2;fill:none}
    .asg{stroke:#176A3C;stroke-width:2.6;fill:none}
    .noedge{stroke:#9aa0a6;stroke-width:1.8;stroke-dasharray:5 4;fill:none}
    .panel{fill:#F7F9FC;stroke:#DDE3EC;stroke-width:1.2}
  </style>

  <text x="28" y="36" class="ttl">How the leakage-free split is built</text>

  <!-- =========================== STEP 1 =========================== -->
  <rect x="20" y="54" width="1320" height="300" rx="12" class="panel"/>
  <text x="40" y="82" class="step">Step 1   Group near-duplicate frames into clusters</text>

  <!-- (a) frames -->
  <use href="#scnA" x="44" y="100" width="92" height="46"/><rect x="44" y="100" width="92" height="46" rx="3" class="frm"/><text x="50" y="113" class="tag" fill="#1F3864">A1</text>
  <use href="#scnA" x="44" y="152" width="92" height="46"/><rect x="44" y="152" width="92" height="46" rx="3" class="frm"/><text x="50" y="165" class="tag" fill="#1F3864">A2</text>
  <use href="#scnA" x="44" y="204" width="92" height="46"/><rect x="44" y="204" width="92" height="46" rx="3" class="frm"/><text x="50" y="217" class="tag" fill="#1F3864">A3</text>
  <path d="M140,118 q12,57 0,114" class="frm"/>
  <text x="90" y="270" text-anchor="middle" class="cap">(a) video frames</text>

  <path d="M150,175 L196,175" class="flow" marker-end="url(#ar)"/>
  <text x="150" y="166" class="sm">dHash</text>

  <!-- (b) hashes -->
  <text x="248" y="129" text-anchor="end" class="sm">A1</text>
  <text x="248" y="181" text-anchor="end" class="sm">A2</text>
  <text x="248" y="233" text-anchor="end" class="sm">A3</text>
  <rect x="252" y="118" width="144" height="14" fill="#fff" stroke="#999"/>
  <rect x="252" y="118" width="9" height="14" fill="#2B3A55"/><rect x="270" y="118" width="9" height="14" fill="#2B3A55"/><rect x="279" y="118" width="9" height="14" fill="#2B3A55"/><rect x="306" y="118" width="9" height="14" fill="#2B3A55"/><rect x="324" y="118" width="9" height="14" fill="#2B3A55"/><rect x="333" y="118" width="9" height="14" fill="#2B3A55"/><rect x="351" y="118" width="9" height="14" fill="#2B3A55"/><rect x="378" y="118" width="9" height="14" fill="#2B3A55"/>
  
  <rect x="252" y="170" width="144" height="14" fill="#fff" stroke="#999"/>
  <rect x="252" y="170" width="9" height="14" fill="#2B3A55"/><rect x="270" y="170" width="9" height="14" fill="#2B3A55"/><rect x="279" y="170" width="9" height="14" fill="#2B3A55"/><rect x="306" y="170" width="9" height="14" fill="#2B3A55"/><rect x="324" y="170" width="9" height="14" fill="#2B3A55"/><rect x="333" y="170" width="9" height="14" fill="#2B3A55"/><rect x="351" y="170" width="9" height="14" fill="#2B3A55"/><rect x="378" y="170" width="9" height="14" fill="#2B3A55"/>
  <rect x="288" y="170" width="9" height="14" fill="#C0392B"/>
  <rect x="252" y="222" width="144" height="14" fill="#fff" stroke="#999"/>
  <rect x="252" y="222" width="9" height="14" fill="#2B3A55"/><rect x="270" y="222" width="9" height="14" fill="#2B3A55"/><rect x="279" y="222" width="9" height="14" fill="#2B3A55"/><rect x="306" y="222" width="9" height="14" fill="#2B3A55"/><rect x="324" y="222" width="9" height="14" fill="#2B3A55"/><rect x="333" y="222" width="9" height="14" fill="#2B3A55"/><rect x="351" y="222" width="9" height="14" fill="#2B3A55"/><rect x="378" y="222" width="9" height="14" fill="#2B3A55"/>
  <rect x="288" y="222" width="9" height="14" fill="#C0392B"/><rect x="351" y="222" width="9" height="14" fill="#C0392B"/>
  <text x="324" y="270" text-anchor="middle" class="cap">(b) perceptual hash (dHash)</text>
  <text x="324" y="286" text-anchor="middle" class="sm">red = bits that differ from A1</text>

  <path d="M404,177 L446,177" class="flow" marker-end="url(#ar)"/>
  <text x="406" y="168" class="sm">compare</text>

  <!-- (c) similarity graph -->
  <line x1="494" y1="151" x2="514" y2="133" class="edge"/>
  <line x1="494" y1="169" x2="514" y2="187" class="edge"/>
  <line x1="600" y1="156" x2="600" y2="196" class="edge"/>
  <path d="M538,124 L582,138" class="noedge"/>
  <circle cx="482" cy="160" r="14" fill="#BBD3F2" stroke="#2C5AA8" stroke-width="1.9"/><text x="482" y="164" text-anchor="middle" class="tag">A1</text>
  <circle cx="524" cy="122" r="14" fill="#BBD3F2" stroke="#2C5AA8" stroke-width="1.9"/><text x="524" y="126" text-anchor="middle" class="tag">A2</text>
  <circle cx="524" cy="198" r="14" fill="#BBD3F2" stroke="#2C5AA8" stroke-width="1.9"/><text x="524" y="202" text-anchor="middle" class="tag">A3</text>
  <circle cx="600" cy="142" r="14" fill="#F7D3A0" stroke="#B5701A" stroke-width="1.9"/><text x="600" y="146" text-anchor="middle" class="tag">B1</text>
  <circle cx="600" cy="210" r="14" fill="#F7D3A0" stroke="#B5701A" stroke-width="1.9"/><text x="600" y="214" text-anchor="middle" class="tag">B2</text>
  <text x="488" y="136" class="sm good" font-weight="bold">d=1</text>
  <text x="488" y="190" class="sm good" font-weight="bold">d=2</text>
  <text x="610" y="184" class="sm good" font-weight="bold">d=3</text>
  <circle cx="560" cy="131" r="8" fill="#fff" stroke="#C0392B" stroke-width="1.8"/>
  <path d="M556,127 L564,135 M564,127 L556,135" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="560" y="112" text-anchor="middle" class="bad" font-size="11" font-weight="bold">d=27</text>
  <text x="470" y="262" class="cap">(c) similarity graph</text>
  <line x1="472" y1="276" x2="492" y2="276" class="edge"/><text x="498" y="280" class="sm">linked (d &#8804; 5)</text>
  <line x1="472" y1="292" x2="492" y2="292" class="noedge"/><circle cx="482" cy="292" r="5" fill="#fff" stroke="#C0392B" stroke-width="1.4"/><path d="M479.5,289.5 L484.5,294.5 M484.5,289.5 L479.5,294.5" stroke="#C0392B" stroke-width="1.4"/><text x="498" y="296" class="sm">not linked (d &gt; 5)</text>

  <path d="M626,170 L664,170" class="flow" marker-end="url(#ar)"/>
  <text x="624" y="161" class="sm">union-find</text>

  <!-- (d) clusters -->
  <rect x="682" y="104" width="176" height="70" rx="8" fill="#fff" stroke="#2C5AA8" stroke-width="1.9" stroke-dasharray="4 3"/>
  <text x="770" y="121" text-anchor="middle" class="sm" fill="#2C5AA8" font-weight="bold">cluster A (3)</text>
  <rect x="694" y="130" width="44" height="34" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="716" y="151" text-anchor="middle" class="tag">A1</text>
  <rect x="746" y="130" width="44" height="34" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="768" y="151" text-anchor="middle" class="tag">A2</text>
  <rect x="798" y="130" width="44" height="34" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="820" y="151" text-anchor="middle" class="tag">A3</text>

  <rect x="682" y="190" width="112" height="62" rx="8" fill="#fff" stroke="#B5701A" stroke-width="1.9" stroke-dasharray="4 3"/>
  <text x="738" y="207" text-anchor="middle" class="sm" fill="#B5701A" font-weight="bold">cluster B (2)</text>
  <rect x="692" y="212" width="44" height="32" rx="4" fill="#F7D3A0" stroke="#B5701A"/><text x="714" y="232" text-anchor="middle" class="tag">B1</text>
  <rect x="740" y="212" width="44" height="32" rx="4" fill="#F7D3A0" stroke="#B5701A"/><text x="762" y="232" text-anchor="middle" class="tag">B2</text>

  <rect x="806" y="190" width="86" height="62" rx="8" fill="#fff" stroke="#6E6E6E" stroke-width="1.9" stroke-dasharray="4 3"/>
  <text x="849" y="207" text-anchor="middle" class="sm" fill="#5E5E5E" font-weight="bold">cluster C (1)</text>
  <rect x="826" y="212" width="46" height="32" rx="4" fill="#DBDBDB" stroke="#6E6E6E"/><text x="849" y="232" text-anchor="middle" class="tag">C1</text>

  <text x="682" y="270" class="cap">(d) connected components = clusters</text>

  <!-- key idea -->
  <rect x="918" y="104" width="410" height="150" rx="8" fill="#EEF3FB" stroke="#C5D3EA"/>
  <text x="936" y="128" class="cap">The key idea</text>
  <text x="936" y="152" class="sm">Each frame is reduced to a 64-bit perceptual hash.</text>
  <text x="936" y="172" class="sm">Two frames are linked when their hashes differ in</text>
  <text x="936" y="192" class="sm">at most 5 bits; connected components (union-find)</text>
  <text x="936" y="212" class="sm">become clusters of near-identical frames.</text>
  <text x="936" y="238" class="sm" font-weight="bold" fill="#1F3864">A cluster = one real scene  &#8594;  19,036 clusters / 26,528 images.</text>

  <!-- =========================== STEP 2 =========================== -->
  <rect x="20" y="370" width="1320" height="416" rx="12" class="panel"/>
  <text x="40" y="398" class="step">Step 2   Assign each whole cluster to a single split (stratified 70 / 15 / 15)</text>

  <text x="48" y="430" class="sm" font-weight="bold">clusters</text>
  <rect x="44" y="438" width="120" height="30" rx="15" fill="#BBD3F2" stroke="#2C5AA8"/><text x="104" y="457" text-anchor="middle" class="tag">cluster A &#183; 3</text>
  <rect x="44" y="476" width="120" height="30" rx="15" fill="#C5E7D0" stroke="#176A3C"/><text x="104" y="495" text-anchor="middle" class="tag">cluster D &#183; 5</text>
  <rect x="44" y="524" width="120" height="30" rx="15" fill="#F7D3A0" stroke="#B5701A"/><text x="104" y="543" text-anchor="middle" class="tag">cluster B &#183; 2</text>
  <rect x="44" y="570" width="120" height="30" rx="15" fill="#DBDBDB" stroke="#6E6E6E"/><text x="104" y="589" text-anchor="middle" class="tag">cluster C &#183; 1</text>
  <rect x="44" y="608" width="120" height="30" rx="15" fill="#EAC3D8" stroke="#8E3A68"/><text x="104" y="627" text-anchor="middle" class="tag">cluster E &#183; 4</text>
  <text x="104" y="662" text-anchor="middle" class="sm">. . .</text>

  <path d="M168,453 C 260,453 300,474 360,474" class="asg" marker-end="url(#arG)"/>
  <path d="M168,491 C 260,491 300,490 360,490" class="asg" marker-end="url(#arG)"/>
  <path d="M168,539 C 270,539 300,570 360,570" class="asg" marker-end="url(#arG)"/>
  <path d="M168,585 C 280,585 300,646 360,646" class="asg" marker-end="url(#arG)"/>
  <path d="M168,623 C 290,623 300,662 360,662" class="asg" marker-end="url(#arG)"/>

  <rect x="368" y="440" width="290" height="80" rx="8" fill="#fff" stroke="#7E8CA6" stroke-width="1.4"/>
  <text x="384" y="464" class="tag" fill="#34495E">TRAIN   70%</text>
  <rect x="496" y="450" width="44" height="30" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="518" y="470" text-anchor="middle" class="tag">A</text>
  <rect x="546" y="450" width="44" height="30" rx="4" fill="#C5E7D0" stroke="#176A3C"/><text x="568" y="470" text-anchor="middle" class="tag">D</text>
  <rect x="596" y="450" width="44" height="30" rx="4" fill="#E6CFE8" stroke="#8E3A68"/><text x="618" y="470" text-anchor="middle" class="tag">..</text>

  <rect x="368" y="536" width="290" height="68" rx="8" fill="#fff" stroke="#7E8CA6" stroke-width="1.4"/>
  <text x="384" y="560" class="tag" fill="#34495E">VAL   15%</text>
  <rect x="546" y="554" width="44" height="30" rx="4" fill="#F7D3A0" stroke="#B5701A"/><text x="568" y="574" text-anchor="middle" class="tag">B</text>

  <rect x="368" y="620" width="290" height="64" rx="8" fill="#fff" stroke="#7E8CA6" stroke-width="1.4"/>
  <text x="384" y="644" class="tag" fill="#34495E">TEST   15%</text>
  <rect x="546" y="636" width="44" height="30" rx="4" fill="#DBDBDB" stroke="#6E6E6E"/><text x="568" y="656" text-anchor="middle" class="tag">C</text>
  <rect x="596" y="636" width="44" height="30" rx="4" fill="#EAC3D8" stroke="#8E3A68"/><text x="618" y="656" text-anchor="middle" class="tag">E</text>

  <text x="368" y="712" class="sm">greedy assignment targets the overall 70/15/15 split for total images,</text>
  <text x="368" y="730" class="sm">balancing per-class proportions as a secondary objective</text>

  <!-- naive panel -->
  <rect x="700" y="422" width="630" height="150" rx="8" fill="#FCEEEC" stroke="#E2B4AE"/>
  <text x="720" y="448" class="cap bad">Naive per-frame split</text>
  <circle cx="864" cy="442" r="9" fill="none" stroke="#C0392B" stroke-width="2"/><path d="M859,437 L869,447 M869,437 L859,447" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
  <text x="720" y="470" class="sm">frames assigned independently, so cluster A is torn across subsets:</text>
  <rect x="720" y="482" width="46" height="30" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="743" y="502" text-anchor="middle" class="tag">A1</text>
  <text x="772" y="502" class="sm">&#8594; TRAIN</text>
  <rect x="858" y="482" width="46" height="30" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="881" y="502" text-anchor="middle" class="tag">A2</text>
  <text x="910" y="502" class="sm">&#8594; TEST</text>
  <rect x="990" y="482" width="46" height="30" rx="4" fill="#BBD3F2" stroke="#2C5AA8"/><text x="1013" y="502" text-anchor="middle" class="tag">A3</text>
  <text x="1042" y="502" class="sm">&#8594; VAL</text>
  <path d="M743,514 C 772,534 852,534 881,514" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arR)"/>
  <text x="812" y="549" text-anchor="middle" class="sm bad">same scene in train &amp; test</text>
  <text x="720" y="566" class="sm bad" font-weight="bold">the model is evaluated on data it has already seen &#8594; inflated metrics.</text>

  <!-- guarantee panel -->
  <rect x="700" y="586" width="630" height="120" rx="8" fill="#EAF6EF" stroke="#A9D6BC"/>
  <text x="720" y="612" class="cap good">Cluster split (ours)</text>
  <circle cx="848" cy="606" r="9" fill="none" stroke="#176A3C" stroke-width="2"/><path d="M843,606 L847,611 L854,601" stroke="#176A3C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="636" class="sm">A cluster is never divided, so no near-identical frame can land in two subsets.</text>
  <text x="720" y="660" class="sm good" font-weight="bold">Verified on the final split: 0 clusters span subsets, 0 cross-split duplicates.</text>
  <text x="720" y="684" class="sm">Reported metrics therefore reflect generalisation, not memorised frames.</text>
</svg>
