<rect x="1150" y="150" width="344" height="64" rx="6" fill="#EFF6E9" stroke="#9FBE74" stroke-width="1.5"/><text x="1322.0" y="179.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3B6D11">Append-only · zero-gated (γ = 0 at init)</text><text x="1322.0" y="195.0" text-anchor="middle" font-size="10.5" fill="#444">every module starts as the identity → exact pretrained transfer; gates open only where they reduce loss, so they can only help.</text>
<rect x="1150" y="228" width="344" height="60" rx="6" fill="#EEF3FB" stroke="#C5D3EA" stroke-width="1.5"/><text x="1322.0" y="255.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F3864">Scale-specific enhancement + global context</text><text x="1322.0" y="271.0" text-anchor="middle" font-size="10.5" fill="#444">fine detail at P3 (small objects), wide context at P4/P5; a global cue at every level separates the heterogeneous ‘other’ class.</text>
<rect x="1150" y="300" width="344" height="58" rx="6" fill="#FCF1EC" stroke="#E2B4AE" stroke-width="1.5"/><text x="1322.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#883014">Dual-head deep supervision</text><text x="1322.0" y="342.0" text-anchor="middle" font-size="10.5" fill="#444">the train-only aux head forces the backbone to keep high-resolution detail; removed at inference (zero cost).</text>
