# YOLO26 with an ADDITIVE P2/4 level: rows 0-22 are byte-identical to yolo26.yaml, so
# every one of them keeps its name AND shape and transfers from the 3-level yolo26s.pt.
# Stock yolo26-p2.yaml inserts the P2 branch mid-head, shifting rows 17+ by six; those
# layers then miss intersect_dicts on the key name and initialise from scratch -- the
# whole bottom-up PAN plus the head. Here only rows 23-25 and Detect are fresh.
# Pair with Detect.head_ch=128 so the head widths also match the checkpoint.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-p2add.yaml' will call yolo26-p2add.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.50, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone -- identical to yolo26.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head -- rows 11-22 identical to yolo26.yaml, then the P2 branch is appended
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  # appended P2 branch -- the only rows the checkpoint cannot supply
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23 from P3 head
  - [[-1, 2], 1, Concat, [1]] # 24 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 25 (P2/4-xsmall)

  - [[25, 16, 19, 22], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
