# yolo26-p2dys WITHOUT THE P5 DETECTION LEVEL. Detect(P2, P3, P4), strides 4/8/16.
#
# WHY. Finding F1 of DATASET_v6i/raw/diag_anchor_footprin_results.txt, titled
# "THE P5 BUDGET IS LARGELY FICTION":
#
#     level        s8      s16      s32
#     pool<topk  36.2%    77.8%    96.2%
#     pool==0     0.2%     6.3%    31.1%
#     positives to small GTs   6.64   1.08   0.01
#     positives to medium GTs  6.48   3.39   0.00
#     positives to large GTs   0.16   7.96   1.68
#     SEL BIAS    0.94     1.42     0.34   <- flagged METRIC-BIASED
#
# Small GTs draw 0.01 positives from stride 32 and medium draw 0.00. Only large
# uses it, at 1.68 positives, and large is 7.7% of this dataset -- so P5 earns
# about 0.13 positives per ground-truth object across the whole set, while rows
# 7-10 and 28 are the most expensive stage in the network.
#
# SEL BIAS 0.34 also says s32 is METRIC-starved, not merely geometry-starved,
# which is why a per-level budget cannot repair it -- and why LB-TAL's six
# attempts on this dataset all landed below baseline.
#
# LARGE OBJECTS DO NOT LIVE ON P5. Finding F5: 7.96 of large's 9.79 stock
# positives come from s16. Removing P5 should therefore cost large very little.
# Say "no detectable change" rather than "no change" in any write-up: mAP50_large
# has a pooled sd of 2.33 in this project, so nothing under ~4.7 is readable.
#
# SECONDARY ARGUMENT. With P2 present the top-down path from P5 to P2 is THREE
# upsamples. That is a long dilution chain reaching the level where 60% of the
# instances are. Dropping P5 shortens it to two.
#
# WHAT IS AND IS NOT CHANGED. The P5 BACKBONE STAGE IS KEPT (rows 7-10, including
# SPPF and C2PSA) so the deepest semantic context still feeds the top-down path
# at row 11. ONLY the P5 detection branch is removed: head rows 26-28 and the P5
# entry in Detect. That keeps this a ONE-VARIABLE change against yolo26-p2dys,
# which is the point -- truncating the backbone as well would confound
# "P5 detection is useless" with "P5 context is useless".
#
# Row indices 0-25 are IDENTICAL to yolo26-p2dys.yaml. Nothing below row 25 is
# referenced by anything above it, so no `from` index shifts.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.50, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone — UNCHANGED from yolo26-p2dys.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10   <- still feeds the top-down path at row 11

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, DySample, [2]] # 17 content-aware P3 -> P2, groups=4 (campaign setting)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  # --- REMOVED relative to yolo26-p2dys.yaml -------------------------------
  #   - [-1, 1, Conv, [512, 3, 2]]                    # was 26
  #   - [[-1, 10], 1, Concat, [1]]                    # was 27, cat head P5
  #   - [-1, 1, C3k2, [1024, True, 0.5, True]]        # was 28 (P5/32-large)
  # -------------------------------------------------------------------------

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4) — strides 4, 8, 16
