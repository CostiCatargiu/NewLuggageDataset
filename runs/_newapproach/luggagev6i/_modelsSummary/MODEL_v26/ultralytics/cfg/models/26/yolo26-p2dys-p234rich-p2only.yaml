# yolo26-p2dys-p234rich with the extra depth on the P2 BRANCH ONLY.
#
# WHY THIS EXISTS: p234rich MOVED TWO ROWS AT ONCE AND CANNOT BE ATTRIBUTED.
#
#     graph                row 19 (P2/4)   row 22 (P3/8)   small50   mAP50-95
#     yolo26-p2dys-p234          2               2          78.10      55.44
#     yolo26-p2dys-p234rich      4               4          78.72      56.10
#     THIS FILE                  4               2            ?          ?
#
# p234rich is the only cell of six in the p2 grid that beat the baseline on
# mAP50-95 (+0.80) and it is the one that preserved recall (AR50_95_small 70.92
# vs the baseline's 71.14, while every other cell fell to 66-68). But it changed
# BOTH fine levels, so "the gain came from more capacity at P2" and "the gain
# came from more capacity at P3" are both consistent with it.
#
# This run separates them. With p234 (2,2) and p234rich (4,4) already measured,
# (4,2) gives the P2-only contribution directly, and (4,4) - (4,2) gives the
# P3-only contribution by subtraction. Two existing runs plus one new one turn a
# two-variable change into an attributable pair.
#
# WHY P2 IS THE ONE TO ISOLATE. It is where the anchor supply is thinnest — a
# small GT holds ~12.90 anchor centres on the stock 3-level graph against ~657
# for a large one — and where 60%+ of this dataset's instances live. If the
# depth gain is a P2 effect it supports "spend capacity where the objects are";
# if it is a P3 effect that story is wrong and the reallocation is generic.
#
# NOT A PERFORMANCE RUN. Expected to land BETWEEN p234 and p234rich. Its value
# is attribution, and attribution is what makes p234rich reportable rather than
# merely observed.
#
# CAVEAT: p234 and p234rich are n=1 each, so the +0.62 this file decomposes is
# itself 1.3 SE at the arch run-to-run SE of ~0.488. Decomposing a suggestive
# effect gives two suggestive halves.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.50, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone — UNCHANGED from yolo26-p2dys.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10   <- still feeds the top-down path at row 11

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, DySample, [2]] # 17 content-aware P3 -> P2, groups=4 (campaign setting)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 4, C3k2, [128, True]] # 19 (P2/4-xsmall)  <- REPEATS 2 -> 4  (the ONLY change)

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)   <- held at 2, unlike p234rich

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4) — strides 4, 8, 16
