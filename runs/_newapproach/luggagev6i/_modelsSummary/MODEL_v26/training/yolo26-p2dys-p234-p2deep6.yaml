# yolo26-p2dys-p234 with depth (6, 2): SIX repeats on the P2/4 branch, P3/8 held at 2.
#
# WHY. The p234 depth decomposition separated cleanly by level, and the two
# levels do OPPOSITE things:
#
#     step                          d small   d mAP50-95   d AR50_95_small
#     P2 depth 2->4   (2,2)->(4,2)    +0.29      +0.57          +0.14
#     P3 depth 2->4   (4,2)->(4,4)    +0.34      +0.10          -0.47
#
# P2 depth buys mAP50-95 AND RAISES the small-object recall ceiling. P3 depth
# buys small-object mAP50 but COSTS recall. yolo26-p2dys-p234rich bundles both,
# which is why it lands mid-table on everything.
#
# Every other configuration in this campaign buys small-object precision and
# pays for it in recall: AR50_95_small runs 66-68 against a baseline of 71.14
# for every high-precision cell. The (4,2) point is the ONLY one that came in
# ABOVE baseline on both mAP50-95 (+0.70) and AR50_95_small (+0.25).
#
# THIS FILE ISOLATES THE GOOD HALF AND PUSHES IT. If the P2-depth effect is real
# and roughly linear, (6,2) should extend +0.57 mAP50-95 and +0.14 AR without
# paying the P3 recall cost back.
#
# WHY IT MATTERS BEYOND THE NUMBER. For an unattended-luggage alarm a missed bag
# is a missed alarm, so the recall ceiling is arguably the metric that decides
# the system. A configuration that improves mAP50-95 AND recall is worth more
# than one that reaches a higher mAP50 by finding fewer objects more
# confidently.
#
# WHY DEPTH AND NOT WIDTH. Width was tried three times and answered:
#     y26_p2_wide 55.53   y26_wide_starve 55.46   y26_p2addw_base 55.06
# all at or below the matched control.
#
# CAVEAT. The decomposition it rests on is n=1 vs n=1 at an arch run-to-run SE
# of ~0.488, so the +0.29 / +0.34 split is well inside the noise. The DIRECTIONS
# are what motivate this file, not the magnitudes.
#
# Rows 0-18 and 20-26 are identical to yolo26-p2dys-p234.yaml; only row 19 moves.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.50, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone — UNCHANGED from yolo26-p2dys.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10   <- still feeds the top-down path at row 11

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, DySample, [2]] # 17 content-aware P3 -> P2, groups=4 (campaign setting)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 6, C3k2, [128, True]] # 19 (P2/4-xsmall)  <- REPEATS 2 -> 6, THE ONLY CHANGE

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)   <- HELD AT 2, unlike rich/rich6

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [[19, 22, 25], 1, Detect, [nc]] # Detect(P2, P3, P4) — strides 4, 8, 16
