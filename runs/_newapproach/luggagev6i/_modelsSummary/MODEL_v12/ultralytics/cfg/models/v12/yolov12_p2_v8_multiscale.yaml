# YOLOv12 P2 Variant 8 - Multi-Scale Fusion
# Fuse P2 + P3 + P4 features into enhanced P2

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11 - P4 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14 - P3 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17 - P2 base

  # Multi-scale fusion into P2
  - [14, 1, Conv, [64, 1, 1]]           # 18 - reduce P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19 - upsample P3
  - [11, 1, Conv, [64, 1, 1]]           # 20 - reduce P4
  - [-1, 1, nn.Upsample, [None, 4, "nearest"]]  # 21 - upsample P4
  - [[-1, 19, 17], 1, Concat, [1]]      # 22 - fuse P2+P3+P4
  - [-1, 2, C3k2, [128, True]]          # 23 - enhanced P2

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False, 0.25]]   # 26

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 29

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 32

  - [[23, 26, 29, 32], 1, Detect, [nc]]
