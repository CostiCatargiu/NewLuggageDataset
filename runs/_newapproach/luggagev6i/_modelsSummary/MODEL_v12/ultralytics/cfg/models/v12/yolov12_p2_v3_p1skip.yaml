# YOLOv12 P2 Variant 3 - P1 Skip Connection
# Skip from P1 (highest res) to enhance P2 fine details

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 - P1/2 (will skip)
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17

  # P1 Skip Branch
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18 - upsample to P1 size
  - [[-1, 0], 1, Concat, [1]]           # 19 - concat with P1
  - [-1, 1, Conv, [64, 3, 1]]           # 20 - process
  - [-1, 1, Conv, [128, 3, 2]]          # 21 - back to P2 size
  - [[-1, 17], 1, Concat, [1]]          # 22 - fuse with P2
  - [-1, 2, C3k2, [128, False, 0.25]]   # 23 - final P2

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False, 0.25]]   # 26

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 29

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 32

  - [[23, 26, 29, 32], 1, Detect, [nc]]
