# C1: P2 Head + Rich C3k2 at P2
# Hypothesis: C3k2(True) at P2 gives richer spatial features for small obj
# Change from P2 Head: layer 17 C3k2[128,False,0.25] -> C3k2[128,True,0.5] x3
nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C3k2, [128, True, 0.5]]     # 17 ← CHANGED: False,0.25,x2 → True,0.5,x3

  - [-1, 1, Conv, [128, 3, 2]]          # 18
  - [[-1, 14], 1, Concat, [1]]          # 19
  - [-1, 2, A2C2f, [256, False, -1]]    # 20

  - [-1, 1, Conv, [256, 3, 2]]          # 21
  - [[-1, 11], 1, Concat, [1]]          # 22
  - [-1, 2, A2C2f, [512, False, -1]]    # 23

  - [-1, 1, Conv, [512, 3, 2]]          # 24
  - [[-1, 8], 1, Concat, [1]]           # 25
  - [-1, 3, C3k2, [1024, True]]         # 26

  - [[17, 20, 23, 26], 1, Detect, [nc]]
