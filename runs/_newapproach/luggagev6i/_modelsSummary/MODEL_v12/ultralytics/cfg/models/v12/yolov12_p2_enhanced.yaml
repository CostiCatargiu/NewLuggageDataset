# YOLOv12 Weapon - P2 Enhanced
# P2 Head with enhanced small object feature extraction
# Extra attention block at P2 for better small object features

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1 - P2/4
  - [-1, 3, C3k2, [256, False, 0.25]]   # 2 - More depth at P2 (was 2, now 3)
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3 - P3/8
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5 - P4/16
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7 - P5/32
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  # Top-down path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C3k2, [128, False, 0.25]]   # 17 - Enhanced P2 (3 blocks vs 2)
  - [-1, 1, A2C2f, [128, True, 2]]      # 18 - Extra attention at P2 <- KEY!

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 21

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 24

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 27

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect from enhanced P2
