# C2: P2 Head + Double C3k2 at P2
# Hypothesis: Two-stage refinement at P2 > single deeper block
# Change from P2 Head: add second C3k2 after fusion
nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17 - P2 fusion (same)
  - [-1, 2, C3k2, [128, True]]          # 18 ← NEW: refinement block

  - [-1, 1, Conv, [128, 3, 2]]          # 19
  - [[-1, 14], 1, Concat, [1]]          # 20
  - [-1, 2, A2C2f, [256, False, -1]]    # 21

  - [-1, 1, Conv, [256, 3, 2]]          # 22
  - [[-1, 11], 1, Concat, [1]]          # 23
  - [-1, 2, A2C2f, [512, False, -1]]    # 24

  - [-1, 1, Conv, [512, 3, 2]]          # 25
  - [[-1, 8], 1, Concat, [1]]           # 26
  - [-1, 3, C3k2, [1024, True]]         # 27

  - [[18, 21, 24, 27], 1, Detect, [nc]] # detect from refined P2
