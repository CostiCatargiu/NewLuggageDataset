# YOLOv12 Weapon - P2 Auxiliary Head
# P2 Head with auxiliary small object detection branch
# Dedicated deep attention branch for very small objects (<32px)

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3 - P3/8
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5 - P4/16
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7 - P5/32
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  # Top-down path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17 - P2 base

  # Auxiliary small object branch (NEW!)
  - [-1, 2, A2C2f, [128, True, 4]]      # 18 - Deep attention for small obj
  - [-1, 1, C3k2, [128, True]]          # 19 - Extra processing for tiny objects

  # Main P2 branch continues
  - [17, 1, Conv, [128, 3, 1]]          # 20 - Standard P2 output

  # Bottom-up path (from main P2)
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 23

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 26

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 29

  # Detect with auxiliary head (5 heads total)
  # aux_P2 (tiny), P2 (small), P3 (medium), P4 (large), P5 (xlarge)
  - [[19, 20, 23, 26, 29], 1, Detect, [nc]]
