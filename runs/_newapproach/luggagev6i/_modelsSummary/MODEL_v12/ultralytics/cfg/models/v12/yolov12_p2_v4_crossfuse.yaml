# YOLOv12 P2 Variant 4 - Cross-Scale Fusion
# P3 semantic context fused into P2 for better discrimination

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14 - P3 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17 - initial P2

  # Cross-scale: P3 context → P2
  - [14, 1, Conv, [128, 1, 1]]          # 18 - reduce P3 channels
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19 - upsample
  - [[-1, 17], 1, Concat, [1]]          # 20 - fuse
  - [-1, 2, C3k2, [128, True]]          # 21 - enhanced P2

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False, 0.25]]   # 24

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 27

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 30

  - [[21, 24, 27, 30], 1, Detect, [nc]]
