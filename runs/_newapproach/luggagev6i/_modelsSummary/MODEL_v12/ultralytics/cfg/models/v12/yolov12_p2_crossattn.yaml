# YOLOv12 Weapon - P2 Cross-Attention
# P2 Head with cross-scale attention fusion
# P3 context features are fused into P2 for better discrimination

nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3 - P3/8
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5 - P4/16
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7 - P5/32
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  # Top-down path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11 - P4 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14 - P3 features

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False, 0.25]]   # 17 - Initial P2

  # Cross-scale context injection (NEW!)
  - [14, 1, Conv, [128, 1, 1]]          # 18 - Reduce P3 channels
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19 - Upsample to P2 size
  - [[-1, 17], 1, Concat, [1]]          # 20 - Fuse P2 + P3 context
  - [-1, 2, A2C2f, [128, True, 2]]      # 21 - Attention fusion <- KEY!

  # Bottom-up path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 24

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 27

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C3k2, [1024, True]]         # 30

  - [[21, 24, 27, 30], 1, Detect, [nc]]
