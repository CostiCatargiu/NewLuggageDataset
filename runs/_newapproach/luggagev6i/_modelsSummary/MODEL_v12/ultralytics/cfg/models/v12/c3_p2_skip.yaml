# C3: P2 Head + backbone P1 skip connection
# Hypothesis: Direct access to stride-2 features improves small obj
# Change from P2 Head: concat backbone layer 0 into P2 fusion
nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 - stride 2 (P1-level)
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2 - stride 4 (P2-level)
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]    # 3
  - [-1, 3, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5
  - [-1, 4, A2C2f, [512, True, 4]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7
  - [-1, 5, A2C2f, [1024, True, 1]]     # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]    # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]    # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]

  # Add stride-2 backbone features via pooling to match P2 stride
  - [0, 1, Conv, [64, 3, 2]]            # 17 ← pool layer 0 to stride 4
  - [[-1, 16], 1, Concat, [1]]          # 18 ← fuse with top-down+backbone
  - [-1, 2, C3k2, [128, False, 0.25]]   # 19 - P2 with extra skip

  - [-1, 1, Conv, [128, 3, 2]]          # 20
  - [[-1, 14], 1, Concat, [1]]          # 21
  - [-1, 2, A2C2f, [256, False, -1]]    # 22

  - [-1, 1, Conv, [256, 3, 2]]          # 23
  - [[-1, 11], 1, Concat, [1]]          # 24
  - [-1, 2, A2C2f, [512, False, -1]]    # 25

  - [-1, 1, Conv, [512, 3, 2]]          # 26
  - [[-1, 8], 1, Concat, [1]]           # 27
  - [-1, 3, C3k2, [1024, True]]         # 28

  - [[19, 22, 25, 28], 1, Detect, [nc]]
