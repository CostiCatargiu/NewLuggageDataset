# RepConv at P3
nc: 3
scales:
  n: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]
  - [-1, 3, A2C2f, [1024, True, 1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, A2C2f, [256, False, -1]]   # P4: 256ch 16x16  [layer 11]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [128, False, -1]]   # P3: 128ch 32x32  [layer 14]

  - [14, 1, RepConv, [128, 3, 1]]      # [layer 15] c2=128, k=3, s=1
  - [15, 1, C3k2,   [128, False, 0.5]] # [layer 16] explicit src=15

  - [16, 1, Conv,   [128, 3, 2]]       # [layer 17]
  - [[-1, 11], 1, Concat, [1]]         # [layer 18] 384ch 16x16
  - [-1, 3, A2C2f,  [256, False, -1]]  # [layer 19]

  - [19, 1, Conv,   [256, 3, 2]]       # [layer 20]
  - [[-1, 8], 1, Concat, [1]]          # [layer 21] 768ch 8x8
  - [-1, 2, C3k2,   [512, True]]       # [layer 22]

  - [[16, 19, 22], 1, Detect, [nc]]
