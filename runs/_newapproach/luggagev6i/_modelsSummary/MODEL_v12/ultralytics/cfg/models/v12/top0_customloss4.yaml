# Original YOLOv12s (3 detection heads)
# YOLOv12-turbo + FSUS
nc: 3
scales:
  n: [0.50, 0.50, 1024]


# YOLO12-turbo backbone (unchanged)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]     # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]    # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]     # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]    # 4 (native P3 backbone features)
  - [-1, 1, Conv,  [512, 3, 2]]           # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]        # 6
  - [-1, 1, Conv,  [1024, 3, 2]]          # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]       # 8

# YOLO12-turbo + FSUS head
head:
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 6], 1, Concat, [1]]                     # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]              # 11

  # P4 → P3 upsample
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12 (upsampled P4 — blurry)

  # FSUS: compare upsampled P4 (layer 12) against native backbone P3 (layer 4)
  # args: [c_proj=64, loss_weight=0.05]
  # output: passthrough of layer 12 (upsampled features unchanged)
  - [[12, 4], 1, FeatureSharpener, [64, 0.05]]    # 13

  - [[-1, 4], 1, Concat, [1]]                     # 14 cat with backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]              # 15 (P3/8-small)

  # Bottom-up
  - [-1, 1, Conv, [256, 3, 2]]                    # 16
  - [[-1, 11], 1, Concat, [1]]                    # 17 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]]              # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [[-1, 8], 1, Concat, [1]]                     # 20 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]               # 22 Detect(P3, P4, P5)

