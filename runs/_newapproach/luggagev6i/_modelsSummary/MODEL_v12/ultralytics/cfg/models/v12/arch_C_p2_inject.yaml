# Option C: P2 injection into P3 (no 4th detection head)
# Fix: avoids anchor dilution entirely — P2 features enrich P3
# Keeps 3 detection heads (same as winning original architecture)
nc: 3
scales:
  n: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]    # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]   # 2 (P2 features)
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]    # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]   # 4
  - [-1, 1, Conv,  [512, 3, 2]]          # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]       # 6
  - [-1, 1, Conv,  [1024, 3, 2]]         # 7-P5/32
  - [-1, 3, A2C2f, [1024, True, 1]]      # 8

head:
  # Top-down to P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]     # 11 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]     # 14 (P3 initial)

  # P2 injection: downsample backbone P2 to P3 resolution and fuse
  - [2, 1, Conv, [256, 3, 2]]            # 15: backbone P2 → stride 2 → P3 size
  - [[14, 15], 1, Concat, [1]]           # 16: P3 + P2_downsampled
  - [-1, 2, C3k2, [256, False, 0.5]]     # 17: fused P3 (P2-enriched)

  # Bottom-up
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]     # 20 (P4)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]          # 23 (P5)

  - [[17, 20, 23], 1, Detect, [nc]]      # 3 heads only — no anchor dilution
