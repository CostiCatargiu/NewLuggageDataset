# ============================================================================
# Weapon-detection architecture experiments — FULL architectures
# Dataset: GunDatasetNoAugSplitAblation70 (nc=4)   Base: YOLOv12s (yolov12s.pt)
# Baseline: v5_tal07_full = 83.12% mAP50 (stock YOLOv12s)
# Each entry = one unique model definition (full backbone + neck + head).
# 'variants' lists every experiment run name that used that exact architecture.
# 139 unique architectures across 149 experiment variants.
# Generated: 2026-07-20
# ============================================================================

architectures:
  - id: arch_001
    variants:
      - name: "arch_p3_attn_70"
        description: "P3 attention enabled (simplest change)"
    source_scripts: [run_ablation_overnight_all.py]
    model_yaml: |
      # YOLOv12s + P3 Head Attention
      nc: 4
      scales:
        s: [0.50, 0.50, 1024]

      backbone:
        - [-1, 1, Conv,  [64, 3, 2]]
        - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
        - [-1, 2, C3k2,  [256, False, 0.25]]
        - [-1, 1, Conv,  [256, 3, 2, 1, 4]]
        - [-1, 2, C3k2,  [512, False, 0.25]]
        - [-1, 1, Conv,  [512, 3, 2]]
        - [-1, 4, A2C2f, [512, True, 4]]
        - [-1, 1, Conv,  [1024, 3, 2]]
        - [-1, 4, A2C2f, [1024, True, 1]]

      head:
        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 6], 1, Concat, [1]]
        - [-1, 2, A2C2f, [512, False, -1]]

        - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
        - [[-1, 4], 1, Concat, [1]]
        - [-1, 2, A2C2f, [256, True, 4]]          # 14 — P3 with ATTENTION

        - [-1, 1, Conv, [256, 3, 2]]
        - [[-1, 11], 1, Concat, [1]]
        - [-1, 2, A2C2f, [512, False, -1]]

        - [-1, 1, Conv, [512, 3, 2]]
        - [[-1, 8], 1, Concat, [1]]
        - [-1, 2, C3k2, [1024, True]]

        - [[14, 17, 20], 1, Detect, [nc]]

