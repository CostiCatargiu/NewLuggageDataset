        - [[14, 15], 1, Concat, [1]]              # 16 — concat both paths (128+256=384ch)
        - [-1, 1, Conv, [256, 1, 1]]              # 17 — project to standard 256ch

        - [-1, 1, Conv, [256, 3, 2]]
        - [[-1, 11], 1, Concat, [1]]
