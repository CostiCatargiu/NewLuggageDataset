        description: "[5/6] Dense skip P3↔P4 — bidirectional flow"
    source_scripts: [run_arch_exploration_ablation.py]
    model_yaml: |
      # Dense Skip P3↔P4 — bidirectional feature flow
      nc: 4
      scales:
        s: [0.50, 0.50, 1024]

      backbone:
        - [-1, 1, Conv,  [64, 3, 2]]
        - [-1, 1, Conv,  [128, 3, 2, 1, 2]]
