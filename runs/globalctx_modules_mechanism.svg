<svg viewBox="0 0 1130 960" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<style>
.h{font-size:15px;font-weight:600;fill:#1b1b1b}.ch{font-size:12px;font-weight:600;fill:#555}
.tt{font-size:14.5px;font-weight:700}.t{font-size:11px;fill:#1b1b1b}.ts{font-size:11px;fill:#444}
.bx{stroke-width:1}.cteal{fill:#E1F5EE;stroke:#0F6E56}.cpink{fill:#FBEAF0;stroke:#993556}
.cpurple{fill:#EEEDFE;stroke:#534AB7}.ccoral{fill:#FAECE7;stroke:#993C1D}.cblue{fill:#E6F1FB;stroke:#185FA5}
.cgray{fill:#F1EFE8;stroke:#5F5E5A}.camber{fill:#FAEEDA;stroke:#854F0B}
.eff{fill:#EAF3DE;stroke:#9FBE74}
.ar{stroke:#5F5E5A;stroke-width:1.2;fill:none}.sk{stroke:#888780;stroke-width:1;fill:none}
.op{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1.1}.div{stroke:#E0DDD4;stroke-width:1}
.lteal{fill:#085041}.lpink{fill:#72243E}.lpurple{fill:#3C3489}.lcoral{fill:#712B13}.lgreen{fill:#27500A}.lgr{fill:#1D9E75}
</style>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1,1.5 L6.5,4 L1,6.5" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker>
<marker id="ms" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1,1.5 L6.5,4 L1,6.5" fill="none" stroke="#888780" stroke-width="1.2"/></marker>
<marker id="mg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1,1.5 L6.5,4 L1,6.5" fill="none" stroke="#1D9E75" stroke-width="1.2"/></marker></defs>

<rect x="20" y="40" width="1090" height="22" fill="#F1EFE8"/><text class="h" x="20" y="28">How the new modules help — mechanism &amp; rationale</text>
<text class="ts" x="430" y="28">block internals are op-exact; problem/effect are interpretive</text>
<text class="ch" x="150" y="52" text-anchor="middle">problem / finding</text>
<text class="ch" x="600" y="52" text-anchor="middle">inside the block (exact)</text>
<text class="ch" x="985" y="52" text-anchor="middle">effect</text>
<line class="div" x1="20" y1="62" x2="1110" y2="62"/>
<line class="div" x1="20" y1="282" x2="1110" y2="282"/>
<line class="div" x1="20" y1="500" x2="1110" y2="500"/>
<line class="div" x1="20" y1="720" x2="1110" y2="720"/>
<line class="div" x1="300" y1="62" x2="300" y2="938"/>
<line class="div" x1="858" y1="62" x2="858" y2="938"/>

<text class="tt lteal" x="52" y="88">ZGSmallDetail · P3</text>
<text class="ts" x="28" y="112">Small objects are reliably found</text>
<text class="ts" x="28" y="128">(high recall) but poorly scored (low</text>
<text class="ts" x="28" y="144">AP): the model localises them yet</text>
<text class="ts" x="28" y="160">mis-ranks them. Large-receptive-field</text>
<text class="ts" x="28" y="176">fusion branches pull the backbone</text>
<text class="ts" x="28" y="192">toward medium/large and erode the</text>
<text class="ts" x="28" y="208">fine P3 detail small objects need.</text>
<text class="t" x="332" y="176" text-anchor="middle" font-weight="600">x</text>
<path class="ar" d="M342,172 L350,172" marker-end="url(#m)"/>
<rect class="bx cblue" x="352" y="160" width="42" height="24" rx="4"/><text class="t" x="373" y="176" text-anchor="middle">1×1</text>
<path class="ar" d="M394,172 L402,151" marker-end="url(#m)"/><path class="ar" d="M394,172 L402,197" marker-end="url(#m)"/>
<rect class="bx cteal" x="404" y="140" width="72" height="22" rx="4"/><text class="t" x="440" y="155" text-anchor="middle">DWConv k3</text>
<rect class="bx cteal" x="404" y="186" width="72" height="22" rx="4"/><text class="t" x="440" y="201" text-anchor="middle">DWConv k5</text>
<path class="ar" d="M476,151 L484,167" marker-end="url(#m)"/><path class="ar" d="M476,197 L484,177" marker-end="url(#m)"/>
<circle class="op" cx="492" cy="172" r="9"/><text class="t" x="492" y="176" text-anchor="middle">+</text>
<path class="ar" d="M501,172 L506,172" marker-end="url(#m)"/>
<rect class="bx cgray" x="508" y="160" width="70" height="24" rx="4"/><text class="t" x="543" y="176" text-anchor="middle">GN + SiLU</text>
<path class="ar" d="M578,172 L586,172" marker-end="url(#m)"/>
<rect class="bx cblue" x="588" y="160" width="42" height="24" rx="4"/><text class="t" x="609" y="176" text-anchor="middle">1×1</text>
<path class="ar" d="M630,172 L636,172" marker-end="url(#m)"/>
<circle class="op" cx="648" cy="172" r="11"/><text class="t" x="648" y="176" text-anchor="middle">×γ</text>
<path class="ar" d="M659,172 L672,172" marker-end="url(#m)"/>
<circle class="op" cx="684" cy="172" r="11"/><text class="t" x="684" y="176" text-anchor="middle">+</text>
<path class="sk" d="M336,158 C336,108 684,104 684,158" marker-end="url(#ms)"/>
<text class="ts" x="540" y="114" text-anchor="middle">residual skip (x), γ=0 at init</text>
<path class="ar" d="M695,172 L713,172" marker-end="url(#m)"/><text class="ts" x="719" y="176" text-anchor="start">y</text>
<text class="ts" x="373" y="206" text-anchor="middle">pw1</text><text class="ts" x="609" y="206" text-anchor="middle">pw2</text>
<rect class="bx eff" x="866" y="120" width="238" height="98" rx="6"/>
<text class="ts" x="878" y="142">Two small depthwise kernels (no</text>
<text class="ts" x="878" y="158">large RF) reinforce fine local detail.</text>
<text class="ts" x="878" y="174">γ=0 init → it can only help, never</text>
<text class="ts" x="878" y="190">hurt. Counterbalances the large-RF</text>
<text class="t lgreen" x="878" y="208" font-weight="600">bias → small-object AP ↑</text>

<text class="tt lpink" x="52" y="306">ZGLSKAWideFuseV2 · P4</text>
<text class="ts" x="28" y="330">An earlier fusion variant used TWO</text>
<text class="ts" x="28" y="346">large-RF branches (square k11 + strip</text>
<text class="ts" x="28" y="362">k23). Both smooth small-object</text>
<text class="ts" x="28" y="378">features at the fusion source, so</text>
<text class="ts" x="28" y="394">small/"other" precision drops while</text>
<text class="ts" x="28" y="410">context for medium/large stays good.</text>
<text class="t" x="330" y="392" text-anchor="middle" font-weight="600">x</text>
<path class="ar" d="M340,389 L346,389" marker-end="url(#m)"/>
<rect class="bx cblue" x="348" y="377" width="56" height="24" rx="4"/><text class="t" x="376" y="393" text-anchor="middle">1×1→2C</text>
<path class="ar" d="M404,389 L414,352" marker-end="url(#m)"/><path class="ar" d="M404,389 L414,424" marker-end="url(#m)"/>
<text class="ts" x="410" y="347" text-anchor="end">z1</text><text class="ts" x="410" y="436" text-anchor="end">z2</text>
<rect class="bx cpink" x="416" y="338" width="86" height="24" rx="4"/><text class="t" x="459" y="354" text-anchor="middle">ZGLKA k11</text>
<rect class="bx cpink" x="416" y="402" width="86" height="22" rx="4"/><text class="t" x="459" y="417" text-anchor="middle">LSKA strip-23</text>
<rect class="bx cteal" x="416" y="430" width="64" height="22" rx="4"/><text class="t" x="448" y="445" text-anchor="middle">DW k3+k5</text>
<path class="ar" d="M480,441 L484,441" marker-end="url(#m)"/>
<rect class="bx cteal" x="486" y="430" width="58" height="22" rx="4"/><text class="t" x="515" y="445" text-anchor="middle">GN+SiLU</text>
<path class="ar" d="M502,413 L552,424" marker-end="url(#m)"/><path class="ar" d="M544,441 L554,432" marker-end="url(#m)"/>
<circle class="op" cx="564" cy="427" r="9"/><text class="t" x="564" y="431" text-anchor="middle">+</text>
<path class="ar" d="M502,350 L580,382" marker-end="url(#m)"/><path class="ar" d="M573,427 L584,398" marker-end="url(#m)"/>
<rect class="bx cgray" x="586" y="377" width="52" height="24" rx="4"/><text class="t" x="612" y="393" text-anchor="middle">concat</text>
<path class="ar" d="M638,389 L644,389" marker-end="url(#m)"/>
<rect class="bx cblue" x="646" y="377" width="42" height="24" rx="4"/><text class="t" x="667" y="393" text-anchor="middle">1×1</text>
<path class="ar" d="M688,389 L694,389" marker-end="url(#m)"/>
<circle class="op" cx="706" cy="389" r="11"/><text class="t" x="706" y="393" text-anchor="middle">×γ</text>
<path class="ar" d="M717,389 L730,389" marker-end="url(#m)"/><circle class="op" cx="742" cy="389" r="11"/><text class="t" x="742" y="393" text-anchor="middle">+</text>
<path class="sk" d="M334,372 C380,308 700,308 742,377" marker-end="url(#ms)"/><text class="ts" x="520" y="302" text-anchor="middle">residual skip (γ=0)</text>
<text class="ts" x="476" y="470" text-anchor="middle">hybrid branch-2: large-RF (strip) + small-RF (detail)</text>
<path class="ar" d="M753,389 L771,389" marker-end="url(#m)"/><text class="ts" x="777" y="393" text-anchor="start">y</text>
<rect class="bx eff" x="866" y="338" width="238" height="98" rx="6"/>
<text class="ts" x="878" y="360">Branch-1 keeps square context; the</text>
<text class="ts" x="878" y="376">hybrid branch-2 adds a small-RF path</text>
<text class="ts" x="878" y="392">(k3+k5) next to the strip. One block</text>
<text class="ts" x="878" y="408">now serves all scales —</text>
<text class="t lgreen" x="878" y="426" font-weight="600">context + detail, no trade-off</text>

<text class="tt lpurple" x="52" y="524">ZGGlobalContext · all scales</text>
<text class="ts" x="28" y="548">The "other" class is heterogeneous and</text>
<text class="ts" x="28" y="564">defined largely by context. A purely</text>
<text class="ts" x="28" y="580">local receptive field struggles to</text>
<text class="ts" x="28" y="596">separate "weapon" from "other" without</text>
<text class="ts" x="28" y="612">any image-wide signal.</text>
<text class="t" x="330" y="612" text-anchor="middle" font-weight="600">x</text>
<path class="ar" d="M340,609 L352,609" marker-end="url(#m)"/>
<rect class="bx camber" x="354" y="597" width="92" height="24" rx="4"/><text class="t" x="400" y="613" text-anchor="middle">Global Avg Pool</text>
<path class="ar" d="M446,609 L458,609" marker-end="url(#m)"/>
<rect class="bx cblue" x="460" y="597" width="104" height="24" rx="4"/><text class="t" x="512" y="613" text-anchor="middle">1×1 ↓ C/r + SiLU</text>
<path class="ar" d="M564,609 L576,609" marker-end="url(#m)"/>
<rect class="bx cblue" x="578" y="597" width="72" height="24" rx="4"/><text class="t" x="614" y="613" text-anchor="middle">1×1 ↑ C</text>
<path class="ar" d="M650,609 L662,609" marker-end="url(#m)"/>
<circle class="op" cx="674" cy="609" r="11"/><text class="t" x="674" y="613" text-anchor="middle">×γ</text>
<path class="ar" d="M685,609 L706,609" marker-end="url(#m)"/><circle class="op" cx="718" cy="609" r="11"/><text class="t" x="718" y="613" text-anchor="middle">+</text>
<path class="sk" d="M334,595 C362,570 690,566 718,597" marker-end="url(#ms)"/>
<text class="ts" x="545" y="558" text-anchor="middle">broadcast a global channel-context vector to every location</text>
<path class="ar" d="M729,609 L747,609" marker-end="url(#m)"/><text class="ts" x="753" y="613" text-anchor="start">y</text>
<rect class="bx eff" x="866" y="556" width="238" height="98" rx="6"/>
<text class="ts" x="878" y="578">A global channel-context vector</text>
<text class="ts" x="878" y="594">recalibrates every location. Gated,</text>
<text class="ts" x="878" y="610">near-zero cost. Aids appearance-vs-</text>
<text class="t lgreen" x="878" y="630" font-weight="600">context classes such as "other"</text>

<text class="tt lcoral" x="52" y="744">DetectAuxDual · head</text>
<text class="ts" x="28" y="768">Training the head only through the</text>
<text class="ts" x="28" y="784">ENHANCED features lets the backbone</text>
<text class="ts" x="28" y="800">drift toward context and lose fine</text>
<text class="ts" x="28" y="816">detail: nothing forces it to keep the</text>
<text class="ts" x="28" y="832">raw high-resolution information.</text>
<rect class="bx cgray" x="330" y="760" width="80" height="34" rx="5"/><text class="t" x="370" y="781" text-anchor="middle">backbone</text>
<path class="ar" d="M410,768 L452,762 L486,762" marker-end="url(#m)"/>
<path class="ar" d="M410,786 L452,832 L486,832" marker-end="url(#m)" style="stroke-dasharray:5 3"/>
<rect class="bx cpink" x="488" y="748" width="120" height="28" rx="5"/><text class="t" x="548" y="766" text-anchor="middle">main: ENHANCED</text>
<rect class="bx cteal" x="488" y="818" width="120" height="28" rx="5" style="stroke-dasharray:5 3"/><text class="t" x="548" y="836" text-anchor="middle">aux: RAW (anchor)</text>
<path class="ar" d="M608,762 L640,762" marker-end="url(#m)"/>
<rect class="bx ccoral" x="642" y="748" width="100" height="28" rx="5"/><text class="t" x="692" y="766" text-anchor="middle">detections</text>
<path class="ar" d="M608,832 L640,832" marker-end="url(#m)" style="stroke-dasharray:5 3"/>
<rect class="bx cgray" x="642" y="818" width="100" height="28" rx="5" style="stroke-dasharray:5 3"/><text class="t" x="692" y="836" text-anchor="middle">aux loss</text>
<path d="M642,840 C520,884 400,830 372,798" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#mg)"/>
<text class="ts lgr" x="500" y="892" text-anchor="middle">gradient forces backbone to KEEP detail</text>
<text class="ts" x="752" y="836" text-anchor="start">train only</text>
<rect class="bx eff" x="866" y="752" width="238" height="100" rx="6"/>
<text class="ts" x="878" y="774">Main consumes ENHANCED features;</text>
<text class="ts" x="878" y="790">aux is anchored on RAW features, so</text>
<text class="ts" x="878" y="806">the backbone must keep both context</text>
<text class="ts" x="878" y="822">AND detail. Aux dropped at inference.</text>
<text class="t lgreen" x="878" y="842" font-weight="600">detail preserved · 0 inference cost</text>
<rect x="20" y="70" width="5" height="205" rx="2" fill="#0F6E56"/><circle cx="36" cy="83" r="11" fill="#0F6E56"/><text x="36" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">1</text><rect x="20" y="292" width="5" height="200" rx="2" fill="#993556"/><circle cx="36" cy="301" r="11" fill="#993556"/><text x="36" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">2</text><rect x="20" y="510" width="5" height="200" rx="2" fill="#534AB7"/><circle cx="36" cy="519" r="11" fill="#534AB7"/><text x="36" y="523" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">3</text><rect x="20" y="730" width="5" height="200" rx="2" fill="#993C1D"/><circle cx="36" cy="739" r="11" fill="#993C1D"/><text x="36" y="743" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
</svg>
