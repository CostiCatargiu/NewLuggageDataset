# Ultralytics YOLO11 with LuggageCBAM-Lite for luggage detection
# Lighter variant: applies LuggageCBAM attention at strategic neck positions only
# Minimal compute overhead while still benefiting from attention mechanism
#
# Compared to yolo11-luggage-cbam.yaml:
# - Uses standard C3k2 blocks in backbone (less overhead)
# - Applies C2fCBAM only at P3/P4 fusion points in head
# - Better for faster training and inference
#
# Usage:
#   from ultralytics import YOLO
#   model = YOLO('yolo11-luggage-cbam-lite.yaml')
#   model.train(data='luggage.yaml', epochs=100)

# Parameters
nc: 3  # number of classes: backpack, bag, trolley
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # extra large

# Standard YOLO11 backbone (no attention overhead)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

# YOLO11 head with targeted LuggageCBAM attention
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # cat backbone P4
  - [-1, 2, C3k2, [512, False]]        # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # cat backbone P3
  - [-1, 2, C2fCBAM, [256, False]]     # 16 (P3/8-small) - attention for small objects

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]         # cat head P4
  - [-1, 2, C2fCBAM, [512, False]]     # 19 (P4/16-medium) - attention for medium objects

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]         # cat head P5
  - [-1, 2, C3k2, [1024, True]]        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]    # Detect(P3, P4, P5)
