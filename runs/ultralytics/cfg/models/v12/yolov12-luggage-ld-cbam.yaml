# YOLOv12 LD + LuggageCBAM for luggage detection
#
# COMBINES TWO BEST APPROACHES:
# 1. LD (P3Boost): Compute rebalancing → +2.2% recall, +8.5% large mAP50
# 2. LuggageCBAM: Attention module → +0.6% mAP50, +3% precision
#
# Architecture changes from baseline:
# - Backbone P3: 2→3 C3k2 reps (more capacity for small/medium)
# - Backbone P5: 4→2 A2C2f reps (less overfit on large)
# - Head P3: 2→3 A2C2f reps (stronger P3 detection)
# - LuggageCBAM after P3 and P4 fusion (attention refinement)
#
# Expected outcome:
# - LD's recall boost + CBAM's precision boost
# - Best of both worlds (hopefully!)
#
# Previous results:
# - LD alone: mAP50=0.7283, Recall=0.6718, Large=0.6320
# - CBAM alone: mAP50=0.7291, Precision=0.7581, Recall=0.6447
#
# Dataset: backpack (27%), bag (22%), trolley (51%)
# Sizes: Small 27% | Medium 57% | Large 16%

nc: 3
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 3, C3k2,  [512, False, 0.25]]      # 4 — LD: 2→3 (more P3 capacity)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6 — unchanged
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, A2C2f, [1024, True, 1]]         # 8 — LD: 4→2 (moderate P5 reduction)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 11
  - [-1, 1, LuggageCBAM, [16, True]]        # 12 — CBAM at P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, A2C2f, [256, False, -1]]        # 15 — LD: 2→3 (more P3 head capacity)
  - [-1, 1, LuggageCBAM, [16, True]]        # 16 — CBAM at P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]              # concat with P4 (after CBAM)
  - [-1, 2, A2C2f, [512, False, -1]]        # 19

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 22

  - [[16, 19, 22], 1, Detect, [nc]]         # Detect(P3, P4, P5)
