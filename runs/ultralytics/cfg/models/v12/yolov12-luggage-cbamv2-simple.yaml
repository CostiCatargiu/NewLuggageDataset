# YOLOv12 with LuggageCBAMv2 (Simple) - Only at P3 detection head
#
# Minimal change version - single LuggageCBAMv2 at P3 only
# This tests if CBAMv2 improvements help without adding too much complexity
#
# Key differences from v1:
# - Content-aware multi-scale spatial attention (3x3 + 7x7 + 11x11)
# - Learnable residual weight
# - Less aggressive channel reduction (8 vs 16)
# - No class-aware bias (SATAL handles this)

nc: 3
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]        # 14
  - [-1, 1, LuggageCBAMv2, [8]]             # 15 - CBAMv2 at P3 only

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 18

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 21

  - [[15, 18, 21], 1, Detect, [nc]]         # Detect(P3, P4, P5)
