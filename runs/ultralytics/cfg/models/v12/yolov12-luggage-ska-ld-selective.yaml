# YOLOv12 SKA + LD Selective for luggage detection
#
# IDEA: Combine SKA and LD - each EXACTLY as tested
#
# LD changes (from ARCH_LUG3):
# - Backbone P3: 2→3 C3k2 reps (more P3 capacity)
# - Backbone P5: 4→2 A2C2f reps (reduce P5 overfit)
# - Head P3: 2→3 A2C2f reps (more P3 head capacity)
#
# SKA changes (from ska-sequential):
# - Head P3: A2C2f → C2fLSKA cascade (LSKA refinement)
#
# CONFLICT at Head P3: LD wants 3 reps A2C2f, SKA wants 2 reps + LSKA
# DECISION: Use 3 reps A2C2f (LD) + C2fLSKA (SKA) = both changes
#
# Previous results:
# - SKA alone: Small +0.8%, Large -2.4%
# - LD alone: Large +4.9%, Recall +1.5%
#
# Dataset: backpack (27%), bag (22%), trolley (51%)
# Sizes: Small 27% | Medium 57% | Large 16%

nc: 3
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 3, C3k2,  [512, False, 0.25]]      # 4 — LD: 2→3 (more P3 capacity)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6 — unchanged
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, A2C2f, [1024, True, 1]]         # 8 — LD: 4→2 (reduce P5 overfit)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, A2C2f, [256, False, -1]]        # 14 — LD: 2→3 (more P3 head capacity)
  - [-1, 2, C2fLSKA, [256, False]]          # 15 — SKA: LSKA refinement

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 18

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 21

  - [[15, 18, 21], 1, Detect, [nc]]         # Detect(P3 with SKA, P4, P5)
