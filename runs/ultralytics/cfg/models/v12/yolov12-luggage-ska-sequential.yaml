# YOLOv12 with Sequential A2C2f → LSKA at P3
#
# KEY IDEA: Instead of replacing A2C2f with LSKA (which showed +0.05% only),
# stack them sequentially so they complement each other:
#   - A2C2f: Area-based spatial attention (WHERE to look)
#   - C2fLSKA: Large kernel attention (WHAT shape to recognize)
#
# This is different from pure replacement because:
# 1. A2C2f still does its job (preserves original pathway)
# 2. LSKA adds shape-aware refinement specifically for detection
# 3. Complementary attention: area regions + large kernel shapes
#
# Previous SKA results: mAP50=0.7253 (+0.05%), Small +1.1%, Backpack +2.0%
# Goal: Stack benefits without interference
#
# Dataset: backpack (27%), bag (22%), trolley (51%)
# Sizes: Small 27% | Medium 57% | Large 16%

nc: 3
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]        # 14 - Standard P3 processing
  - [-1, 2, C2fLSKA, [256, False]]          # 15 - LSKA refinement for P3 detection

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 18

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 21

  - [[15, 18, 21], 1, Detect, [nc]]         # Detect(P3 after LSKA, P4, P5)
