# YOLOv12 with D-CBAM (Deformable CBAM) for shape-adaptive luggage detection
#
# PAPER CONTRIBUTION:
# "Shape-adaptive attention complements size-adaptive loss (SATAL)"
#
# Key innovation: Deformable spatial attention learns to adapt sampling pattern
# to different luggage shapes:
# - Trolleys (tall, narrow): learns vertical sampling pattern
# - Bags (wide, flat): learns horizontal sampling pattern  
# - Backpacks (square): learns uniform sampling pattern
#
# Combined with SATAL loss:
# - SATAL handles SIZE adaptation in the loss function
# - D-CBAM handles SHAPE adaptation in the architecture
#
# Dataset characteristics:
# - Classes: backpack (27%), bag (22%), trolley (51%)
# - Object sizes: Small 27% | Medium 57% | Large 16%
#
# Usage:
#   from ultralytics import YOLO
#   model = YOLO('yolov12-luggage-dcbam.yaml')
#   model.train(data='luggage.yaml', epochs=100)

# Parameters
nc: 3  # number of classes: backpack, bag, trolley
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # extra large

# YOLOv12 backbone with D-CBAM at P3/P4 (where shape matters most)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C2fDCBAM,  [512, False]]        # 4 - D-CBAM for P3 (shape-adaptive for small objects)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6 - keep A2C2f area-attention
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8 - keep A2C2f for P5

# YOLOv12 head with D-CBAM at P3/P4 outputs
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C2fDCBAM, [512, False]]         # 11 - D-CBAM for P4 fusion

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C2fDCBAM, [256, False]]         # 14 - D-CBAM for P3 output (small objects)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]              # cat head P4
  - [-1, 2, C2fDCBAM, [512, False]]         # 17 - D-CBAM for P4 output (medium objects)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]               # cat head P5
  - [-1, 2, C3k2, [1024, True]]             # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]]         # Detect(P3, P4, P5)
