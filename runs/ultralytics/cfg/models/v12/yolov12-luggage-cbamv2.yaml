# YOLOv12 with LuggageCBAMv2 for luggage detection
#
# IMPROVEMENTS OVER V1:
# 1. Removed class-aware bias (SATAL handles class balancing)
# 2. Lower reduction ratio (8 vs 16) - preserves more channel info
# 3. Scale-adaptive spatial attention with content-aware fusion
#    - 3x3: Fine details (straps, handles)
#    - 7x7: Medium context (bag body)
#    - 11x11: Large context (trolley)
# 4. Learnable residual weight (α * attention + (1-α) * identity)
#
# V1 Results: mAP50=0.7291 (+0.6%), Precision=0.7581 (+3%), Recall=0.6447 (-1.9%)
# Goal: Improve recall while maintaining precision gains
#
# Dataset: backpack (27%), bag (22%), trolley (51%)
# Sizes: Small 27% | Medium 57% | Large 16%

nc: 3
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # 11
  - [-1, 1, LuggageCBAMv2, [8]]             # 12 - CBAMv2 at P4 (reduction=8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]        # 15
  - [-1, 1, LuggageCBAMv2, [8]]             # 16 - CBAMv2 at P3 (reduction=8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]              # cat with P4 after CBAM
  - [-1, 2, A2C2f, [512, False, -1]]        # 19

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # 22

  - [[16, 19, 22], 1, Detect, [nc]]         # Detect(P3, P4, P5)
