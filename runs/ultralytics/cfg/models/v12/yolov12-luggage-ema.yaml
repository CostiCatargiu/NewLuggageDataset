# YOLOv12 with C2fEMA - Efficient Multi-scale Attention for luggage detection
# 
# RECOMMENDED: Lighter than LuggageCBAM, should preserve recall better
#
# Key features:
# - C2fEMA uses parallel multi-scale convolutions (1x1, 3x3, 5x5)
# - Coordinate attention for better spatial awareness
# - Standard Bottleneck blocks (less overhead than BottleneckCBAM)
# - Single EMA attention after output conv
#
# Expected improvements over LuggageCBAM v1:
# - Better recall (LuggageCBAM lost -4.08% recall)
# - Faster training
# - Similar or better precision boost
#
# Usage:
#   from ultralytics import YOLO
#   model = YOLO('yolov12-luggage-ema.yaml')
#   model.train(data='luggage.yaml', epochs=100)

# Parameters
nc: 3  # number of classes: backpack, bag, trolley
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # extra large

# YOLOv12 backbone with C2fEMA at P3/P4 (small/medium objects)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C2fEMA,  [512, False]]          # 4 - EMA for P3 (small objects 27%)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6 - keep A2C2f area-attention
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8 - keep A2C2f for P5

# YOLOv12 head with C2fEMA at P3/P4 outputs
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C2fEMA, [512, False]]           # 11 - EMA for P4 fusion (medium objects 57%)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C2fEMA, [256, False]]           # 14 - EMA for P3 output (small objects)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]              # cat head P4
  - [-1, 2, C2fEMA, [512, False]]           # 17 - EMA for P4 output (medium objects)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]               # cat head P5
  - [-1, 2, C3k2, [1024, True]]             # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]]         # Detect(P3, P4, P5)
