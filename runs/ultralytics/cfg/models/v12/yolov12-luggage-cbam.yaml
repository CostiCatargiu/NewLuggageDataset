# YOLOv12 with LuggageCBAM for enhanced luggage detection
# Optimized for detecting backpacks, bags, and trolleys with small/medium objects
#
# Key changes from base YOLOv12:
# 1. C2fCBAM blocks at P3/P4 stages for small/medium object attention
# 2. Maintains A2C2f in backbone for area-attention benefits
# 3. Replaces head A2C2f with C2fCBAM at P3/P4 fusion points
# 4. Multi-scale attention optimized for luggage size distribution
#
# Dataset characteristics this is designed for:
# - Classes: backpack (27%), bag (22%), trolley (51%)
# - Object sizes: Small 27% | Medium 57% | Large 16%
#
# Usage:
#   from ultralytics import YOLO
#   model = YOLO('yolov12-luggage-cbam.yaml')
#   model.train(data='luggage.yaml', epochs=100)

# Parameters
nc: 3  # number of classes: backpack, bag, trolley
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano - fast experiments
  s: [0.50, 0.50, 1024]  # small - good balance
  m: [0.50, 1.00, 512]   # medium - better accuracy
  l: [1.00, 1.00, 512]   # large - high accuracy
  x: [1.00, 1.50, 512]   # extra large - maximum accuracy

# YOLOv12 backbone with strategic LuggageCBAM integration
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3-P3/8
  - [-1, 2, C2fCBAM,  [512, False]]         # 4 - LuggageCBAM for P3 (small objects 27%)
  - [-1, 1, Conv,  [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]          # 6 - keep A2C2f area-attention for P4
  - [-1, 1, Conv,  [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]         # 8 - keep A2C2f for P5

# YOLOv12 head with LuggageCBAM at critical fusion points
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C2fCBAM, [512, False]]          # 11 - LuggageCBAM for P4 fusion (medium objects 57%)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C2fCBAM, [256, False]]          # 14 - LuggageCBAM for P3 output (small objects)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]              # cat head P4
  - [-1, 2, C2fCBAM, [512, False]]          # 17 - LuggageCBAM for P4 output (medium objects)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]               # cat head P5
  - [-1, 2, C3k2, [1024, True]]             # 20 (P5/32-large) - keep C3k2 for large objects

  - [[14, 17, 20], 1, Detect, [nc]]         # Detect(P3, P4, P5)
